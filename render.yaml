# Render Blueprint — see RENDER.md for the one-time manual steps this can't do
# (enabling pgvector, applying the schema, and wiring the frontend's public API URL).
databases:
  - name: aocc-postgres
    databaseName: aocc
    user: aocc
    plan: starter
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: aocc-redis
    plan: starter
    ipAllowList: []

  - type: pserv
    name: ai-service
    runtime: docker
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    plan: starter
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: aocc-postgres
          property: connectionString
      - key: LLM_PROVIDER
        value: mock
      - key: EMBEDDING_PROVIDER
        value: mock

  - type: web
    name: gateway
    runtime: docker
    dockerfilePath: ./gateway/Dockerfile
    dockerContext: ./gateway
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aocc-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: aocc-redis
          property: connectionString
      - key: AI_SERVICE_URL
        fromService:
          type: pserv
          name: ai-service
          property: hostport
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: SEED_ADMIN_EMAIL
        value: admin@aocc.local
      - key: SEED_ADMIN_PASSWORD
        sync: false

  - type: worker
    name: aocc-worker
    runtime: docker
    dockerfilePath: ./gateway/Dockerfile
    dockerContext: ./gateway
    dockerCommand: node dist/workers/index.js
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aocc-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: aocc-redis
          property: connectionString
      - key: AI_SERVICE_URL
        fromService:
          type: pserv
          name: ai-service
          property: hostport

  - type: web
    name: frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: starter
    envVars:
      - key: PORT
        value: 5173
      # Set after first deploy, once gateway's onrender.com URL is known — see RENDER.md.
      - key: VITE_API_URL
        sync: false
